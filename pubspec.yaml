name: check_in_domain
description: Flutter package for handling all reusable domain models for CICO.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartz: ^0.10.0
  uuid: ^3.0.4
  freezed_annotation: ^2.1.0
  flutter_localizations:
    sdk: flutter
  injectable: ^1.5.0
  get_it: ^7.2.0
  flutter_bloc: ^7.3.0
  firebase_auth: ^4.7.1
  firebase_core: ^2.15.0
  firebase_storage: ^11.0.3
  firebase_dynamic_links: ^5.0.4
  cloud_firestore: ^4.3.1
  cloud_functions: ^4.0.3
  phone_form_field:
    path: /Users/stefanmiller/AndroidStudioProjects/phone_form_field
  geoflutterfire:
    git: https://github.com/stefanmiller1/GeoFlutterFire
  check_in_credentials:
    path: /Users/stefanmiller/AndroidStudioProjects/check_in_credentials

dev_dependencies:

  build_runner: ^2.4.6
  freezed: ^2.1.0
  injectable_generator: ^1.4.1
  json_serializable: ^6.3.1

  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
dependency_overrides:
  watcher: ^1.1.0

